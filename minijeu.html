<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ATW - Mini-Jeu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Oswald', Arial, sans-serif;
      margin: 0;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      letter-spacing: 0.5px;
    }

    .game-container {
      background: linear-gradient(145deg, #1f1f1f, #111111);
      border: 3px solid #ff0000;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.6);
    }

    h1 {
      color: #ff0000;
      text-transform: uppercase;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
    }

    p {
      color: #aaa;
      margin-bottom: 30px;
      font-family: Arial, sans-serif;
    }

    .btn-back {
      background: #ff0000;
      color: #000;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 25px;
      border-radius: 8px;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
      transition: all 0.2s ease-in-out;
      display: inline-block;
    }

    .btn-back:hover {
      background: #fff;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>ATW Mini-Jeu</h1>
    <p>Le jeu secret est en cours de développement. Prépare-toi à bouncer !</p>
    
    <!-- Zone de jeu à coder ici -->
    <div id="game-canvas-container" style="margin-bottom: 30px;">
      <!-- Tu pourras mettre un canvas ou des éléments interactifs ici -->
    </div>

    <a href="index.html" class="btn-back">▲ Retour au site</a>
  </div>

</body>
</html>
